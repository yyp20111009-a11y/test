<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 工具應用診斷器</title>
<style>
:root{font-family:system-ui,sans-serif;color:#19332e;background:#edf4f0;line-height:1.6}
*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:36px 18px}
header{padding:28px;background:#153e34;color:white;border-radius:20px;margin-bottom:18px}
h1{font-size:clamp(1.65rem,5vw,2.4rem);margin:4px 0}p{margin:8px 0}
small{letter-spacing:.14em;color:#b8e1cc}form,section{background:white;padding:clamp(16px,4vw,30px);border:1px solid #d5e3db;border-radius:20px;margin-bottom:18px}
fieldset{margin:0 0 22px;padding:0;border:0;min-width:0}legend{font-weight:750;margin-bottom:8px}
.options{display:flex;flex-wrap:wrap;gap:8px}label{display:flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid #c6d7ce;border-radius:10px;cursor:pointer}
label:has(input:checked){background:#e0f4e9;border-color:#24755d}input{accent-color:#19634e;margin:0}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;padding:9px 16px;border:1px solid #19634e;background:#19634e;color:white}
button[type=reset]{background:white;color:#19634e}button+button{margin-left:6px}
:focus-visible{outline:3px solid #bf650e;outline-offset:3px}#error{color:#9a2724}h2{margin:0 0 8px}dt{font-weight:750;margin-top:12px}dd{margin:0}footer{font-size:.87rem;color:#425e54}
@media(max-width:520px){.options{display:grid}main{padding-top:18px}}
</style>
</head>
<body><main>
<header><small>三題診斷 · MVP</small><h1>AI 工具應用診斷器</h1><p>選出你最想解決的工作問題，找出一個可以先著手的 AI 應用方向。三題皆為單選必填。</p></header>
<form id="quiz" novalidate>
<fieldset><legend>01　你的工作型態</legend><div class="options">
<label><input required type="radio" name="work" value="solo">個人工作者</label>
<label><input required type="radio" name="work" value="team">小型團隊</label>
<label><input required type="radio" name="work" value="dept">企業部門</label>
</div></fieldset>
<fieldset><legend>02　你最想解決的問題</legend><div class="options">
<label><input required type="radio" name="problem" value="repeat">重複性工作太多</label>
<label><input required type="radio" name="problem" value="analysis">資料分析與決策</label>
<label><input required type="radio" name="problem" value="service">客戶互動與服務</label>
</div></fieldset>
<fieldset><legend>03　你的 AI 使用經驗</legend><div class="options">
<label><input required type="radio" name="experience" value="beginner">初學者</label>
<label><input required type="radio" name="experience" value="experienced">已有使用經驗者</label>
</div></fieldset>
<p id="error" role="alert" hidden></p>
<button type="submit">查看診斷</button><button type="reset">重新開始</button>
</form>
<section id="result" hidden aria-labelledby="direction">
<small style="color:#286650">推薦方向</small><h2 id="direction" tabindex="-1"></h2>
<dl><dt>原因說明</dt><dd id="reason"></dd><dt>下一步建議</dt><dd id="next"></dd>
<dt>工作型態補充</dt><dd id="work-note"></dd><dt>AI 經驗補充</dt><dd id="experience-note"></dd></dl>
<p><small style="color:#426057;letter-spacing:normal">原因與補充說明為 MVP 暫用文案。</small></p>
<button type="button" id="download">下載 HTML 結果</button>
<p id="download-status" role="status"></p>
</section>
<footer>答案只在目前頁面處理，重新整理後會清除。</footer>
</main>
<script>
const recommendations = {
  repeat: ['工作流程自動化', '固定且反覆執行的步驟，適合先整理成可重複執行的流程。', '先找出固定重複的工作流程'],
  analysis: ['互動式分析工具', '固定的計算或評估可整理成表單，讓使用者更換輸入並查看結果。', '從一個固定計算或評估流程開始'],
  service: ['客戶需求診斷工具', '把常見需求整理成問題與選項，可以依回答提供對應的下一步。', '把常見問題整理成選項與判斷規則']
};
const workNotes = {
  solo: '先選一項你自己經常處理、容易核對結果的工作。',
  team: '先從一項團隊共用流程開始，與同事確認輸入和預期結果。',
  dept: '先選一個部門內流程，和流程負責人確認範圍與驗收方式。'
};
const experienceNotes = {
  beginner: '先用一筆範例走完流程，再用手上的工作案例驗證。',
  experienced: '核心流程穩定後，可以考慮加入批次處理或結果比對。'
};
const quiz = document.querySelector('#quiz');
const result = document.querySelector('#result');
const error = document.querySelector('#error');
const status = document.querySelector('#download-status');
const output = ['direction', 'reason', 'next', 'work-note', 'experience-note'].map(id => document.getElementById(id));
function clearFeedback() {
  result.hidden = true;
  error.hidden = true;
  status.textContent = '';
}
quiz.addEventListener('change', clearFeedback);
quiz.addEventListener('reset', () => {
  clearFeedback();
  quiz.querySelector('input').focus();
});
quiz.addEventListener('submit', event => {
  event.preventDefault();
  clearFeedback();
  const data = new FormData(quiz);
  const fields = [
    ['work', workNotes, '工作型態'],
    ['problem', recommendations, '最想解決的問題'],
    ['experience', experienceNotes, 'AI 使用經驗']
  ];
  const missing = fields.filter(([name, table]) => !Object.hasOwn(table, data.get(name)));
  if (missing.length) {
    error.textContent = '請先選擇：' + missing.map(field => field[2]).join('、') + '。';
    error.hidden = false;
    quiz.elements[missing[0][0]][0].focus();
    return;
  }
  const values = [...recommendations[data.get('problem')], workNotes[data.get('work')], experienceNotes[data.get('experience')]];
  output.forEach((element, index) => { element.textContent = values[index]; });
  result.hidden = false;
  output[0].focus();
});
document.querySelector('#download').addEventListener('click', () => {
  if (result.hidden) return;
  let url;
  try {
    const report = document.implementation.createHTMLDocument('AI 工具應用診斷結果');
    report.documentElement.lang = 'zh-Hant';
    for (const [name, attributes] of [
      ['meta', {charset:'utf-8'}],
      ['meta', {name:'viewport', content:'width=device-width, initial-scale=1'}]
    ]) {
      const element = report.createElement(name);
      for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
      report.head.prepend(element);
    }
    const style = report.createElement('style');
    style.textContent = 'body{font:1rem/1.65 system-ui,sans-serif;color:#19332e;max-width:680px;margin:36px auto;padding:0 18px}dt{font-weight:bold;margin-top:14px}dd{margin:0}';
    report.head.append(style);
    const title = report.createElement('h1');
    title.textContent = 'AI 工具應用診斷結果';
    const details = result.querySelector('dl').cloneNode(true);
    const label = report.createElement('dt');
    label.textContent = '推薦方向';
    const direction = report.createElement('dd');
    direction.textContent = output[0].textContent;
    details.prepend(label, direction);
    const note = report.createElement('p');
    note.textContent = '原因與補充說明為 MVP 暫用文案。';
    report.body.append(title, details, note);
    url = URL.createObjectURL(new Blob(['<!doctype html>\n', report.documentElement.outerHTML], {type:'text/html;charset=utf-8'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'ai-diagnosis-result.html';
    document.body.append(link);
    link.click();
    link.remove();
    status.textContent = '已發起下載，請查看瀏覽器的下載清單。';
  } catch {
    status.textContent = '無法產生下載檔，請再試一次。';
  } finally {
    if (url) setTimeout(() => URL.revokeObjectURL(url), 30000);
  }
});
</script>
</body></html>
